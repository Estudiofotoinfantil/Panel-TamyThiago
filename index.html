<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tamy & Thiago | Panel</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet">


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #fffdfb 0%,
            #f8f0ec 45%,
            #f4e9e5 100%
        );

    color: #5e4b4b;

    font-family: "Montserrat", sans-serif;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.container {

    width: 92%;

    max-width: 1100px;

    margin: auto;

    padding: 45px 0 60px;
}


/* =====================================================
   ENCABEZADO
===================================================== */

.header {

    text-align: center;

    margin-bottom: 35px;
}


.header .small {

    font-size: 11px;

    letter-spacing: 4px;

    color: #b18b83;

    margin-bottom: 8px;
}


.header h1 {

    margin: 0;

    font-family: "Cormorant Garamond", serif;

    font-size: 55px;

    font-weight: 600;

    color: #73585b;
}


.header .subtitle {

    margin-top: 5px;

    font-size: 14px;

    letter-spacing: 2px;

    color: #a88b8c;
}


.header .symbol {

    font-size: 20px;

    margin-top: 12px;

    color: #b8958f;
}


/* =====================================================
   TARJETAS
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 16px;

    margin-bottom: 35px;
}


.stat {

    background: rgba(255,255,255,.75);

    border: 1px solid #eadbd6;

    border-radius: 18px;

    padding: 23px 15px;

    text-align: center;

    box-shadow:
        0 8px 25px rgba(120,90,80,.07);
}


.stat-icon {

    font-size: 20px;

    margin-bottom: 7px;

    color: #b28d89;
}


.stat-number {

    font-family: "Cormorant Garamond", serif;

    font-size: 39px;

    font-weight: 600;

    color: #74595c;
}


.stat-label {

    font-size: 11px;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #9c8585;
}


/* =====================================================
   PANEL PRINCIPAL
===================================================== */

.card {

    background: rgba(255,255,255,.84);

    border: 1px solid #eadbd6;

    border-radius: 22px;

    padding: 28px;

    box-shadow:
        0 12px 35px rgba(120,90,80,.08);
}


.card-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 22px;
}


.card-title {

    font-family: "Cormorant Garamond", serif;

    font-size: 32px;

    color: #73585b;

    margin: 0;
}


.connection {

    font-size: 11px;

    color: #8c7777;
}


.connection span {

    display: inline-block;

    width: 8px;

    height: 8px;

    background: #8ea58c;

    border-radius: 50%;

    margin-right: 5px;
}


/* =====================================================
   BOTÓN ACTUALIZAR
===================================================== */

.refresh {

    border: 1px solid #d8c0ba;

    background: #fffaf8;

    color: #765c5d;

    border-radius: 30px;

    padding: 10px 18px;

    font-family: "Montserrat", sans-serif;

    font-size: 11px;

    cursor: pointer;

    transition: .2s;
}


.refresh:hover {

    background: #f5e9e5;

    transform: translateY(-1px);
}


/* =====================================================
   TABLA
===================================================== */

.table-wrap {

    overflow-x: auto;
}


table {

    width: 100%;

    border-collapse: collapse;

    min-width: 650px;
}


th {

    text-align: left;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #9d8585;

    padding: 13px 12px;

    border-bottom: 1px solid #eadbd6;
}


td {

    padding: 16px 12px;

    border-bottom: 1px solid #f0e5e1;

    font-size: 13px;

    color: #665454;
}


td:first-child {

    font-weight: 600;
}


/* =====================================================
   ESTADOS
===================================================== */

.status {

    display: inline-block;

    padding: 6px 11px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: 600;

    text-transform: capitalize;
}


.status.confirmado {

    background: #e8f0e5;

    color: #62785e;
}


.status.no {

    background: #f3e3e0;

    color: #9a6863;
}


.status.pendiente {

    background: #f1ece2;

    color: #8c795c;
}


/* =====================================================
   BOTONES DE ACCIÓN
===================================================== */

.actions {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}


.btn {

    border: none;

    border-radius: 20px;

    padding: 7px 11px;

    font-family: "Montserrat", sans-serif;

    font-size: 10px;

    cursor: pointer;

    transition: .2s;
}


.btn:hover {

    transform: translateY(-1px);
}


.btn-edit {

    background: #eee3df;

    color: #765d5d;
}


.btn-delete {

    background: #f4e2df;

    color: #98645f;
}


/* =====================================================
   SIN RESULTADOS
===================================================== */

.empty {

    text-align: center;

    padding: 35px 15px;

    color: #a18d8d;

    font-size: 13px;
}


/* =====================================================
   MODAL
===================================================== */

.modal-bg {

    position: fixed;

    inset: 0;

    background: rgba(65,45,45,.45);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 1000;
}


.modal-bg.show {

    display: flex;
}


.modal {

    width: 100%;

    max-width: 430px;

    background: #fffaf8;

    border-radius: 22px;

    padding: 30px;

    box-shadow:
        0 20px 60px rgba(60,40,40,.2);
}


.modal h2 {

    margin: 0 0 20px;

    font-family: "Cormorant Garamond", serif;

    font-size: 32px;

    color: #73585b;
}


.form-group {

    margin-bottom: 15px;
}


.form-group label {

    display: block;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: #9b8383;

    margin-bottom: 6px;
}


.form-group input,
.form-group select {

    width: 100%;

    padding: 12px 13px;

    border: 1px solid #dfceca;

    border-radius: 12px;

    background: white;

    color: #5e4b4b;

    font-family: "Montserrat", sans-serif;

    font-size: 13px;

    outline: none;
}


.form-group input:focus,
.form-group select:focus {

    border-color: #b8958f;
}


.modal-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 9px;

    margin-top: 22px;
}


.modal-btn {

    border: none;

    border-radius: 20px;

    padding: 10px 18px;

    cursor: pointer;

    font-family: "Montserrat", sans-serif;

    font-size: 11px;
}


.cancel {

    background: #eee6e3;

    color: #765d5d;
}


.save {

    background: #8e706f;

    color: white;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

    text-align: center;

    padding: 30px;

    color: #9a8585;

    font-size: 12px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 800px) {

    .stats {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .header h1 {

        font-size: 45px;
    }

    .card-header {

        align-items: flex-start;

        flex-direction: column;
    }

}


@media(max-width: 500px) {

    .container {

        width: 94%;

        padding-top: 30px;
    }

    .stats {

        gap: 10px;
    }

    .stat {

        padding: 18px 8px;
    }

    .stat-number {

        font-size: 32px;
    }

    .card {

        padding: 18px;
    }

    .header h1 {

        font-size: 40px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         ENCABEZADO
    ================================================== -->

    <header class="header">

        <div class="small">
            NOVA INVITE PRESENTA
        </div>

        <h1>
            Tamy & Thiago
        </h1>

        <div class="subtitle">
            Panel de organización
        </div>

        <div class="symbol">
            ♡
        </div>

    </header>



    <!-- =================================================
         ESTADÍSTICAS
    ================================================== -->

    <section class="stats">


        <div class="stat">

            <div class="stat-icon">
                ♡
            </div>

            <div
                class="stat-number"
                id="confirmados">
                0
            </div>

            <div class="stat-label">
                Confirmados
            </div>

        </div>



        <div class="stat">

            <div class="stat-icon">
                ♡
            </div>

            <div
                class="stat-number"
                id="personas">
                0
            </div>

            <div class="stat-label">
                Personas
            </div>

        </div>



        <div class="stat">

            <div class="stat-icon">
                ×
            </div>

            <div
                class="stat-number"
                id="noAsisten">
                0
            </div>

            <div class="stat-label">
                No asisten
            </div>

        </div>



        <div class="stat">

            <div class="stat-icon">
                ◌
            </div>

            <div
                class="stat-number"
                id="pendientes">
                0
            </div>

            <div class="stat-label">
                Pendientes
            </div>

        </div>

    </section>



    <!-- =================================================
         LISTA
    ================================================== -->

    <section class="card">


        <div class="card-header">


            <div>

                <h2 class="card-title">
                    Lista de invitados
                </h2>

                <div
                    class="connection"
                    id="connection">

                    <span></span>
                    Conectando...

                </div>

            </div>


            <button
                class="refresh"
                onclick="cargarInvitados()">

                ↻ &nbsp; Actualizar respuestas

            </button>


        </div>



        <div
            class="table-wrap"
            id="tablaContainer">

            <div class="loading">
                Cargando respuestas...
            </div>

        </div>


    </section>


</div>



<!-- =====================================================
     MODAL EDITAR
====================================================== -->

<div
    class="modal-bg"
    id="modalEditar">


    <div class="modal">


        <h2>
            Editar invitado
        </h2>


        <div class="form-group">

            <label>
                Nombre
            </label>

            <input
                type="text"
                id="editNombre">

        </div>


        <div class="form-group">

            <label>
                Personas
            </label>

            <input
                type="number"
                id="editPersonas"
                min="0">

        </div>


        <div class="form-group">

            <label>
                Estado
            </label>

            <select id="editEstado">

                <option value="confirmado">
                    Confirmado
                </option>

                <option value="no">
                    No asiste
                </option>

                <option value="pendiente">
                    Pendiente
                </option>

            </select>

        </div>


        <div class="modal-buttons">

            <button
                class="modal-btn cancel"
                onclick="cerrarModal()">

                Cancelar

            </button>


            <button
                class="modal-btn save"
                onclick="guardarEdicion()">

                Guardar cambios

            </button>

        </div>


    </div>

</div>



<script>


// =====================================================
// URL DEL GOOGLE APPS SCRIPT
// =====================================================

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzjrfUcgu0RafzyAqLHOs7UbPneYO492QBNW7lETNyadxrtTcTYRO_SZGBom_k9ZZEM/exec";


// =====================================================
// VARIABLES
// =====================================================

let invitados = [];

let filaEditando = null;


// =====================================================
// CARGAR INVITADOS
// =====================================================

async function cargarInvitados() {


    const container =
        document.getElementById(
            "tablaContainer"
        );


    container.innerHTML = `
        <div class="loading">
            Cargando respuestas...
        </div>
    `;


    try {


        const respuesta =
            await fetch(
                SCRIPT_URL +
                "?action=getInvitados&t=" +
                Date.now()
            );


        invitados =
            await respuesta.json();


        mostrarInvitados();

        actualizarEstadisticas();


        document.getElementById(
            "connection"
        ).innerHTML = `
            <span></span>
            Conectado · actualizado ahora
        `;


    }


    catch(error) {


        console.error(error);


        document.getElementById(
            "connection"
        ).innerHTML = `
            <span style="background:#b66"></span>
            No se pudieron cargar las respuestas
        `;


        container.innerHTML = `
            <div class="empty">
                No se pudieron cargar las respuestas.
                <br><br>
                Tocá "Actualizar respuestas" para intentar nuevamente.
            </div>
        `;

    }

}



// =====================================================
// MOSTRAR INVITADOS
// =====================================================

function mostrarInvitados() {


    const container =
        document.getElementById(
            "tablaContainer"
        );


    if (
        !invitados ||
        invitados.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                Todavía no hay respuestas.
            </div>
        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        Invitado
                    </th>

                    <th>
                        Personas
                    </th>

                    <th>
                        Estado
                    </th>

                    <th>
                        Acciones
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    invitados.forEach(
        function(invitado) {


            let estado =
                String(
                    invitado.estado ||
                    "pendiente"
                ).toLowerCase();


            let textoEstado =
                estado;


            if (
                estado === "confirmado"
            ) {

                textoEstado =
                    "Confirmado";

            }


            if (
                estado === "no"
            ) {

                textoEstado =
                    "No asiste";

            }


            if (
                estado === "pendiente"
            ) {

                textoEstado =
                    "Pendiente";

            }


            html += `

                <tr>

                    <td>
                        ${escapeHTML(
                            invitado.nombre
                        )}
                    </td>

                    <td>
                        ${Number(
                            invitado.personas
                        ) || 0}
                    </td>

                    <td>

                        <span
                            class="status ${escapeHTML(estado)}">

                            ${textoEstado}

                        </span>

                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="btn btn-edit"
                                onclick="abrirEditar(${invitado.fila})">

                                ✏️ Editar

                            </button>


                            <button
                                class="btn btn-delete"
                                onclick="eliminarInvitado(${invitado.fila}, '${escapeJS(invitado.nombre)}')">

                                🗑️ Eliminar

                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        html;

}



// =====================================================
// ESTADÍSTICAS
// =====================================================

function actualizarEstadisticas() {


    let confirmados = 0;

    let personas = 0;

    let noAsisten = 0;

    let pendientes = 0;


    invitados.forEach(
        function(invitado) {


            const estado =
                String(
                    invitado.estado ||
                    "pendiente"
                ).toLowerCase();


            const cantidad =
                Number(
                    invitado.personas
                ) || 0;


            if (
                estado === "confirmado"
            ) {

                confirmados++;

                personas += cantidad;

            }


            else if (
                estado === "no"
            ) {

                noAsisten++;

            }


            else {

                pendientes++;

            }

        }
    );


    document.getElementById(
        "confirmados"
    ).textContent =
        confirmados;


    document.getElementById(
        "personas"
    ).textContent =
        personas;


    document.getElementById(
        "noAsisten"
    ).textContent =
        noAsisten;


    document.getElementById(
        "pendientes"
    ).textContent =
        pendientes;

}



// =====================================================
// ABRIR EDITAR
// =====================================================

function abrirEditar(fila) {


    const invitado =
        invitados.find(
            function(item) {

                return Number(
                    item.fila
                ) === Number(fila);

            }
        );


    if (!invitado) {

        alert(
            "No se encontró el invitado."
        );

        return;

    }


    filaEditando =
        Number(fila);


    document.getElementById(
        "editNombre"
    ).value =
        invitado.nombre || "";


    document.getElementById(
        "editPersonas"
    ).value =
        Number(
            invitado.personas
        ) || 0;


    document.getElementById(
        "editEstado"
    ).value =
        invitado.estado || "pendiente";


    document.getElementById(
        "modalEditar"
    ).classList.add("show");

}



// =====================================================
// CERRAR MODAL
// =====================================================

function cerrarModal() {

    document.getElementById(
        "modalEditar"
    ).classList.remove("show");

    filaEditando = null;

}



// =====================================================
// GUARDAR EDICIÓN
// =====================================================

async function guardarEdicion() {


    if (!filaEditando) {

        return;

    }


    const nombre =
        document.getElementById(
            "editNombre"
        ).value.trim();


    const personas =
        document.getElementById(
            "editPersonas"
        ).value;


    const estado =
        document.getElementById(
            "editEstado"
        ).value;


    if (!nombre) {

        alert(
            "Escribí el nombre del invitado."
        );

        return;

    }


    const boton =
        document.querySelector(
            ".save"
        );


    boton.disabled = true;

    boton.textContent =
        "Guardando...";


    try {


        const datos =
            new URLSearchParams();


        datos.append(
            "action",
            "editar"
        );


        datos.append(
            "fila",
            filaEditando
        );


        datos.append(
            "nombre",
            nombre
        );


        datos.append(
            "personas",
            personas
        );


        datos.append(
            "estado",
            estado
        );


        await fetch(
            SCRIPT_URL,
            {

                method: "POST",

                mode: "no-cors",

                body: datos

            }
        );


        cerrarModal();


        /*
         * Esperamos un momento para que
         * Google Sheets termine de guardar.
         */

        setTimeout(
            cargarInvitados,
            700
        );


    }


    catch(error) {


        console.error(error);


        alert(
            "No se pudo guardar el cambio."
        );

    }


    finally {

        boton.disabled = false;

        boton.textContent =
            "Guardar cambios";

    }

}



// =====================================================
// ELIMINAR INVITADO
// =====================================================

async function eliminarInvitado(
    fila,
    nombre
) {


    const confirmar =
        confirm(
            "¿Querés eliminar a " +
            nombre +
            " de la lista?"
        );


    if (!confirmar) {

        return;

    }


    try {


        const datos =
            new URLSearchParams();


        datos.append(
            "action",
            "eliminar"
        );


        datos.append(
            "fila",
            fila
        );


        await fetch(
            SCRIPT_URL,
            {

                method: "POST",

                mode: "no-cors",

                body: datos

            }
        );


        setTimeout(
            cargarInvitados,
            700
        );


    }


    catch(error) {


        console.error(error);


        alert(
            "No se pudo eliminar el invitado."
        );

    }

}



// =====================================================
// SEGURIDAD HTML
// =====================================================

function escapeHTML(text) {


    return String(
        text ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



// =====================================================
// SEGURIDAD JAVASCRIPT
// =====================================================

function escapeJS(text) {


    return String(
        text ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\r?\n/g,
        " "
    );

}



// =====================================================
// CERRAR MODAL TOCANDO AFUERA
// =====================================================

document.getElementById(
    "modalEditar"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            cerrarModal();

        }

    }
);



// =====================================================
// CARGA INICIAL
// =====================================================

cargarInvitados();



// =====================================================
// ACTUALIZAR CADA 30 SEGUNDOS
// =====================================================

setInterval(
    cargarInvitados,
    30000
);


</script>


</body>
</html>
