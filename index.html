<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tamy & Thiago | Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet">


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #fffdfb 0%,
            #f8f0ec 45%,
            #f4e9e5 100%
        );

    color: #5e4b4b;

    font-family: "Montserrat", sans-serif;
}


.container {

    width: 92%;

    max-width: 1100px;

    margin: auto;

    padding: 45px 0 60px;
}


/* =========================
   ENCABEZADO
========================= */

.header {

    text-align: center;

    margin-bottom: 35px;
}

.header .small {

    font-size: 11px;

    letter-spacing: 4px;

    color: #b18b83;

    margin-bottom: 8px;
}

.header h1 {

    margin: 0;

    font-family: "Cormorant Garamond", serif;

    font-size: 55px;

    font-weight: 600;

    color: #73585b;
}

.header .subtitle {

    margin-top: 5px;

    font-size: 14px;

    letter-spacing: 2px;

    color: #a88b8c;
}

.header .symbol {

    font-size: 20px;

    margin-top: 12px;

    color: #b8958f;
}


/* =========================
   ESTADÍSTICAS
========================= */

.stats {

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 16px;

    margin-bottom: 35px;
}

.stat {

    background: rgba(255,255,255,.75);

    border: 1px solid #eadbd6;

    border-radius: 18px;

    padding: 23px 15px;

    text-align: center;

    box-shadow:
        0 8px 25px rgba(120,90,80,.07);
}

.stat-icon {

    font-size: 20px;

    margin-bottom: 7px;

    color: #b28d89;
}

.stat-number {

    font-family: "Cormorant Garamond", serif;

    font-size: 39px;

    font-weight: 600;

    color: #74595c;
}

.stat-label {

    font-size: 11px;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #9c8585;
}


/* =========================
   TARJETA
========================= */

.card {

    background: rgba(255,255,255,.84);

    border: 1px solid #eadbd6;

    border-radius: 22px;

    padding: 28px;

    box-shadow:
        0 12px 35px rgba(120,90,80,.08);
}

.card-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 22px;
}

.card-title {

    font-family: "Cormorant Garamond", serif;

    font-size: 32px;

    color: #73585b;

    margin: 0;
}

.connection {

    margin-top: 5px;

    font-size: 11px;

    color: #8c7777;
}

.connection-dot {

    display: inline-block;

    width: 8px;

    height: 8px;

    border-radius: 50%;

    margin-right: 5px;

    background: #8ea58c;
}


/* =========================
   BOTÓN ACTUALIZAR
========================= */

.refresh {

    border: 1px solid #d8c0ba;

    background: #fffaf8;

    color: #765c5d;

    border-radius: 30px;

    padding: 10px 18px;

    font-family: "Montserrat", sans-serif;

    font-size: 11px;

    cursor: pointer;

    transition: .2s;
}

.refresh:hover {

    background: #f5e9e5;
}


/* =========================
   TABLA
========================= */

.table-wrap {

    overflow-x: auto;
}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 700px;
}

th {

    text-align: left;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #9d8585;

    padding: 13px 12px;

    border-bottom: 1px solid #eadbd6;
}

td {

    padding: 16px 12px;

    border-bottom: 1px solid #f0e5e1;

    font-size: 13px;

    color: #665454;
}

td:first-child {

    font-weight: 600;
}


/* =========================
   ESTADOS
========================= */

.status {

    display: inline-block;

    padding: 6px 11px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: 600;

    text-transform: capitalize;
}

.status.confirmado {

    background: #e8f0e5;

    color: #62785e;
}

.status.no {

    background: #f3e3e0;

    color: #9a6863;
}

.status.pendiente {

    background: #f1ece2;

    color: #8c795c;
}


/* =========================
   ACCIONES
========================= */

.actions {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

.action-btn {

    border: 0;

    border-radius: 18px;

    padding: 7px 11px;

    font-family: "Montserrat", sans-serif;

    font-size: 10px;

    cursor: pointer;

    transition: .2s;
}

.action-btn:hover {

    transform: translateY(-1px);
}

.edit-btn {

    background: #eee3df;

    color: #765d5d;
}

.delete-btn {

    background: #f4e2df;

    color: #98645f;
}


/* =========================
   MODAL
========================= */

.modal {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(65,45,45,.45);

    z-index: 9999;
}

.modal.visible {

    display: flex;
}

.modal-box {

    width: 100%;

    max-width: 430px;

    background: #fffaf8;

    border-radius: 22px;

    padding: 30px;

    box-shadow:
        0 20px 60px rgba(60,40,40,.2);
}

.modal-box h2 {

    margin: 0 0 20px;

    font-family: "Cormorant Garamond", serif;

    font-size: 32px;

    color: #73585b;
}

.field {

    margin-bottom: 15px;
}

.field label {

    display: block;

    margin-bottom: 6px;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #9b8383;
}

.field input,
.field select {

    width: 100%;

    padding: 12px;

    border: 1px solid #dfceca;

    border-radius: 12px;

    background: white;

    color: #5e4b4b;

    font-family: "Montserrat", sans-serif;

    outline: none;
}

.modal-actions {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 22px;
}

.modal-button {

    border: 0;

    border-radius: 20px;

    padding: 10px 18px;

    cursor: pointer;

    font-family: "Montserrat", sans-serif;

    font-size: 11px;
}

.cancel-button {

    background: #eee6e3;

    color: #765d5d;
}

.save-button {

    background: #8e706f;

    color: white;
}


/* =========================
   MENSAJES
========================= */

.loading,
.empty {

    text-align: center;

    padding: 35px 15px;

    color: #9a8585;

    font-size: 12px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width: 800px) {

    .stats {

        grid-template-columns: repeat(2, 1fr);
    }

    .header h1 {

        font-size: 45px;
    }

    .card-header {

        align-items: flex-start;

        flex-direction: column;
    }
}

@media(max-width: 500px) {

    .container {

        width: 94%;

        padding-top: 30px;
    }

    .stat {

        padding: 18px 8px;
    }

    .stat-number {

        font-size: 32px;
    }

    .card {

        padding: 18px;
    }

    .header h1 {

        font-size: 40px;
    }
}

</style>

</head>


<body>


<div class="container">


    <header class="header">

        <div class="small">
            NOVA INVITE PRESENTA
        </div>

        <h1>
            Tamy & Thiago
        </h1>

        <div class="subtitle">
            Panel de organización
        </div>

        <div class="symbol">
            ♡
        </div>

    </header>


    <!-- ESTADÍSTICAS -->

    <section class="stats">


        <div class="stat">

            <div class="stat-icon">
                ♡
            </div>

            <div
                class="stat-number"
                id="totalConfirmados">

                0

            </div>

            <div class="stat-label">
                Confirmados
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ♡
            </div>

            <div
                class="stat-number"
                id="totalPersonas">

                0

            </div>

            <div class="stat-label">
                Personas
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ×
            </div>

            <div
                class="stat-number"
                id="totalNo">

                0

            </div>

            <div class="stat-label">
                No asisten
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ◌
            </div>

            <div
                class="stat-number"
                id="totalPendientes">

                0

            </div>

            <div class="stat-label">
                Pendientes
            </div>

        </div>


    </section>


    <!-- LISTA -->

    <section class="card">


        <div class="card-header">


            <div>

                <h2 class="card-title">
                    Lista de invitados
                </h2>

                <div
                    class="connection"
                    id="connection">

                    <span
                        class="connection-dot">
                    </span>

                    Conectando...

                </div>

            </div>


            <button
                class="refresh"
                onclick="cargarInvitados()">

                ↻ &nbsp; Actualizar respuestas

            </button>


        </div>


        <div
            class="table-wrap"
            id="tabla">

            <div class="loading">
                Cargando respuestas...
            </div>

        </div>


    </section>


</div>


<!-- MODAL -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">


        <h2>
            Editar invitado
        </h2>


        <div class="field">

            <label>
                Nombre
            </label>

            <input
                type="text"
                id="nombreEditar">

        </div>


        <div class="field">

            <label>
                Personas
            </label>

            <input
                type="number"
                id="personasEditar"
                min="0">

        </div>


        <div class="field">

            <label>
                Estado
            </label>

            <select id="estadoEditar">

                <option value="confirmado">
                    Confirmado
                </option>

                <option value="no">
                    No asiste
                </option>

                <option value="pendiente">
                    Pendiente
                </option>

            </select>

        </div>


        <div class="modal-actions">


            <button
                class="modal-button cancel-button"
                onclick="cerrarModal()">

                Cancelar

            </button>


            <button
                class="modal-button save-button"
                id="guardarBtn"
                onclick="guardarCambios()">

                Guardar

            </button>


        </div>


    </div>

</div>



<script>


/* =====================================================
   URL
===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzjrfUcgu0RafzyAqLHOs7UbPneYO492QBNW7lETNyadxrtTcTYRO_SZGBom_k9ZZEM/exec";


/* =====================================================
   VARIABLES
===================================================== */

let invitados = [];

let filaActual = null;


/* =====================================================
   CARGAR
===================================================== */

async function cargarInvitados() {


    const tabla =
        document.getElementById("tabla");


    tabla.innerHTML = `
        <div class="loading">
            Cargando respuestas...
        </div>
    `;


    try {


        const url =
            SCRIPT_URL +
            "?action=getInvitados&_=" +
            Date.now();


        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "Error HTTP " +
                response.status
            );

        }


        const texto =
            await response.text();


        if (!texto) {

            throw new Error(
                "Respuesta vacía"
            );

        }


        invitados =
            JSON.parse(texto);


        if (!Array.isArray(invitados)) {

            throw new Error(
                "Formato incorrecto"
            );

        }


        mostrarTabla();

        calcularTotales();


        document.getElementById(
            "connection"
        ).innerHTML = `

            <span
                class="connection-dot">
            </span>

            Conectado · actualizado ahora

        `;


    }
    catch(error) {


        console.error(
            "Error cargando invitados:",
            error
        );


        document.getElementById(
            "connection"
        ).innerHTML = `

            <span
                class="connection-dot"
                style="background:#b66">
            </span>

            Error de conexión

        `;


        tabla.innerHTML = `

            <div class="empty">

                No se pudieron cargar las respuestas.

                <br><br>

                Revisá la conexión con Google y
                tocá "Actualizar respuestas".

            </div>

        `;

    }

}


/* =====================================================
   MOSTRAR TABLA
===================================================== */

function mostrarTabla() {


    const tabla =
        document.getElementById("tabla");


    if (
        !invitados ||
        invitados.length === 0
    ) {

        tabla.innerHTML = `

            <div class="empty">

                No hay respuestas todavía.

            </div>

        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        Invitado
                    </th>

                    <th>
                        Personas
                    </th>

                    <th>
                        Estado
                    </th>

                    <th>
                        Acciones
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    invitados.forEach(function(inv) {


        const estado =
            normalizarEstado(
                inv.estado
            );


        let texto =
            "Pendiente";


        if (
            estado === "confirmado"
        ) {

            texto =
                "Confirmado";

        }


        if (
            estado === "no"
        ) {

            texto =
                "No asiste";

        }


        html += `

            <tr>

                <td>
                    ${escaparHTML(inv.nombre)}
                </td>

                <td>
                    ${Number(inv.personas) || 0}
                </td>

                <td>

                    <span
                        class="status ${estado}">

                        ${texto}

                    </span>

                </td>

                <td>

                    <div class="actions">


                        <button
                            class="action-btn edit-btn"
                            onclick="editarInvitado(${Number(inv.fila)})">

                            ✏️ Editar

                        </button>


                        <button
                            class="action-btn delete-btn"
                            onclick="eliminarInvitado(${Number(inv.fila)})">

                            🗑️ Eliminar

                        </button>


                    </div>

                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    tabla.innerHTML =
        html;

}


/* =====================================================
   TOTALES
===================================================== */

function calcularTotales() {


    let confirmados = 0;

    let personas = 0;

    let no = 0;

    let pendientes = 0;


    invitados.forEach(function(inv) {


        const estado =
            normalizarEstado(
                inv.estado
            );


        const cantidad =
            Number(inv.personas) || 0;


        if (
            estado === "confirmado"
        ) {

            confirmados++;

            personas += cantidad;

        }
        else if (
            estado === "no"
        ) {

            no++;

        }
        else {

            pendientes++;

        }

    });


    document.getElementById(
        "totalConfirmados"
    ).textContent =
        confirmados;


    document.getElementById(
        "totalPersonas"
    ).textContent =
        personas;


    document.getElementById(
        "totalNo"
    ).textContent =
        no;


    document.getElementById(
        "totalPendientes"
    ).textContent =
        pendientes;

}


/* =====================================================
   EDITAR
===================================================== */

function editarInvitado(fila) {


    const invitado =
        invitados.find(function(inv) {

            return Number(inv.fila) ===
                   Number(fila);

        });


    if (!invitado) {

        alert(
            "No se encontró el invitado."
        );

        return;

    }


    filaActual =
        Number(fila);


    document.getElementById(
        "nombreEditar"
    ).value =
        invitado.nombre || "";


    document.getElementById(
        "personasEditar"
    ).value =
        Number(
            invitado.personas
        ) || 0;


    document.getElementById(
        "estadoEditar"
    ).value =
        normalizarEstado(
            invitado.estado
        );


    document.getElementById(
        "modal"
    ).classList.add("visible");

}


/* =====================================================
   CERRAR
===================================================== */

function cerrarModal() {

    document.getElementById(
        "modal"
    ).classList.remove("visible");

    filaActual =
        null;

}


/* =====================================================
   GUARDAR
===================================================== */

async function guardarCambios() {


    if (!filaActual) {

        return;

    }


    const nombre =
        document.getElementById(
            "nombreEditar"
        ).value.trim();


    const personas =
        document.getElementById(
            "personasEditar"
        ).value;


    const estado =
        document.getElementById(
            "estadoEditar"
        ).value;


    if (!nombre) {

        alert(
            "Ingresá el nombre."
        );

        return;

    }


    const boton =
        document.getElementById(
            "guardarBtn"
        );


    boton.disabled = true;

    boton.textContent =
        "Guardando...";


    try {


        const datos =
            new URLSearchParams();


        datos.append(
            "action",
            "editar"
        );


        datos.append(
            "fila",
            String(filaActual)
        );


        datos.append(
            "nombre",
            nombre
        );


        datos.append(
            "personas",
            String(personas)
        );


        datos.append(
            "estado",
            estado
        );


        /*
         * NO usamos mode:no-cors acá.
         * El navegador enviará el formulario
         * al Apps Script.
         */

        await fetch(
            SCRIPT_URL,
            {
                method: "POST",
                body: datos
            }
        );


        cerrarModal();


        /*
         * Esperamos que Google termine
         * de guardar y volvemos a leer.
         */

        setTimeout(
            cargarInvitados,
            1000
        );


    }
    catch(error) {


        console.error(error);


        alert(
            "No se pudo guardar el cambio."
        );

    }


    boton.disabled = false;

    boton.textContent =
        "Guardar";

}


/* =====================================================
   ELIMINAR
===================================================== */

async function eliminarInvitado(fila) {


    const invitado =
        invitados.find(function(inv) {

            return Number(inv.fila) ===
                   Number(fila);

        });


    if (!invitado) {

        return;

    }


    const confirmar =
        confirm(
            "¿Eliminar a " +
            invitado.nombre +
            " de la lista?"
        );


    if (!confirmar) {

        return;

    }


    try {


        const datos =
            new URLSearchParams();


        datos.append(
            "action",
            "eliminar"
        );


        datos.append(
            "fila",
            String(fila)
        );


        await fetch(
            SCRIPT_URL,
            {
                method: "POST",
                body: datos
            }
        );


        setTimeout(
            cargarInvitados,
            1000
        );


    }
    catch(error) {


        console.error(error);


        alert(
            "No se pudo eliminar."
        );

    }

}


/* =====================================================
   ESTADO
===================================================== */

function normalizarEstado(estado) {


    const valor =
        String(
            estado || ""
        )
        .trim()
        .toLowerCase();


    if (
        valor === "confirmado"
    ) {

        return "confirmado";

    }


    if (
        valor === "no" ||
        valor === "no asiste"
    ) {

        return "no";

    }


    return "pendiente";

}


/* =====================================================
   SEGURIDAD
===================================================== */

function escaparHTML(texto) {


    return String(
        texto ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   CERRAR MODAL AFUERA
===================================================== */

document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            cerrarModal();

        }

    }
);


/* =====================================================
   INICIO
===================================================== */

cargarInvitados();


/* =====================================================
   ACTUALIZAR CADA 30 SEGUNDOS
===================================================== */

setInterval(
    cargarInvitados,
    30000
);

</script>


</body>
</html>
